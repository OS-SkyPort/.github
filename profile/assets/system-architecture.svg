<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">SkyPort system architecture</title>
  <desc id="desc">Passenger input moves through parsing, orchestration, the simulation core, and an immutable snapshot. The snapshot then feeds the CLI report, the event log, and the web GUI. The scheduler is a replaceable strategy inside the simulation core.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#2d6cab"/>
    </marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#7a7a7a"/>
    </marker>
    <style>
      .system { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 650; letter-spacing: -0.5px; fill: #1d1d1f; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; fill: #2d6cab; }
      .step { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; fill: #7a7a7a; }
      .label { font-size: 20px; font-weight: 650; letter-spacing: -0.25px; fill: #1d1d1f; }
      .label-dark { font-size: 21px; font-weight: 650; letter-spacing: -0.25px; fill: #ffffff; }
      .body { font-size: 14px; font-weight: 430; fill: #333333; }
      .muted { font-size: 13px; font-weight: 430; fill: #7a7a7a; }
      .dark-muted { font-size: 13px; font-weight: 430; fill: #cccccc; }
      .code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; font-weight: 600; fill: #2d6cab; }
      .flow { fill: none; stroke: #2d6cab; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #2d6cab; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1400" height="820" rx="24" fill="#f5f5f7"/>
  <g class="system">
    <text x="64" y="58" class="eyebrow">SKYPORT · DATA FLOW</text>
    <text x="64" y="101" class="title">한 방향으로 흐르고, 마지막에 표현됩니다.</text>
    <text x="64" y="131" class="body">입력과 실행 로직을 분리하고, 모든 화면은 동일한 상태 스냅샷을 읽습니다.</text>

    <!-- Main flow -->
    <text x="64" y="190" class="step">01 · INPUT</text>
    <rect x="64" y="210" width="194" height="146" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <circle cx="92" cy="242" r="7" fill="#2d6cab"/>
    <text x="110" y="249" class="label">승객 입력</text>
    <text x="92" y="286" class="body">CSV · 공백 구분 데이터</text>
    <rect x="92" y="308" width="82" height="25" rx="12.5" fill="#eef4fa"/>
    <text x="104" y="325" class="code">input.txt</text>

    <text x="290" y="190" class="step">02 · PARSE</text>
    <rect x="290" y="210" width="194" height="146" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="318" y="249" class="label">Parser</text>
    <text x="318" y="286" class="body">입력을 Passenger 객체로</text>
    <text x="318" y="308" class="body">검증하고 변환</text>
    <text x="318" y="333" class="code">data_io/parser.py</text>

    <text x="516" y="190" class="step">03 · ORCHESTRATE</text>
    <rect x="516" y="210" width="194" height="146" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="544" y="249" class="label">Entry Point</text>
    <text x="544" y="276" class="code">main.py</text>
    <line x1="544" y1="293" x2="682" y2="293" stroke="#e0e0e0"/>
    <text x="544" y="320" class="body">정책 · 실행 모드 선택</text>
    <text x="544" y="341" class="muted">compare · web · log</text>

    <text x="742" y="190" class="step">04 · SIMULATE</text>
    <rect x="742" y="210" width="374" height="250" rx="18" fill="#272729"/>
    <text x="774" y="251" class="label-dark">Simulation Core</text>
    <text x="774" y="276" class="dark-muted">도착 → 완료 → 배정 → 시간 진행</text>

    <rect x="774" y="300" width="310" height="77" rx="11" fill="#333335" stroke="#48484a"/>
    <text x="794" y="324" class="dark-muted">교체 가능한 Scheduler Strategy</text>
    <rect x="794" y="339" width="52" height="23" rx="11.5" fill="#454547"/>
    <rect x="853" y="339" width="65" height="23" rx="11.5" fill="#454547"/>
    <rect x="925" y="339" width="43" height="23" rx="11.5" fill="#454547"/>
    <rect x="975" y="339" width="91" height="23" rx="11.5" fill="#2d6cab"/>
    <text x="805" y="355" style="font: 600 11px ui-monospace, Menlo, monospace; fill:#fff">FCFS</text>
    <text x="862" y="355" style="font: 600 11px ui-monospace, Menlo, monospace; fill:#fff">Priority</text>
    <text x="935" y="355" style="font: 600 11px ui-monospace, Menlo, monospace; fill:#fff">SJF</text>
    <text x="986" y="355" style="font: 600 11px ui-monospace, Menlo, monospace; fill:#fff">HybridMLQ</text>

    <rect x="774" y="393" width="148" height="42" rx="11" fill="#333335"/>
    <rect x="936" y="393" width="148" height="42" rx="11" fill="#333335"/>
    <text x="794" y="419" class="dark-muted">등급별 대기열</text>
    <text x="956" y="419" class="dark-muted">5개 체크인 카운터</text>

    <text x="1148" y="190" class="step">05 · PUBLISH</text>
    <rect x="1148" y="210" width="188" height="146" rx="18" fill="#ffffff" stroke="#2d6cab" stroke-width="2"/>
    <rect x="1148" y="210" width="188" height="7" rx="3.5" fill="#2d6cab"/>
    <text x="1176" y="254" class="label">SimSnapshot</text>
    <text x="1176" y="287" class="body">불변 상태 뷰</text>
    <text x="1176" y="310" class="muted">결과 · 로그 · ATT</text>
    <text x="1176" y="334" class="muted">UI와 엔진의 경계</text>

    <!-- Main arrows -->
    <path class="flow" d="M258 283H281"/>
    <path class="flow" d="M484 283H507"/>
    <path class="flow" d="M710 283H733"/>
    <path class="flow" d="M1116 283H1139"/>

    <!-- Presentation fan-out -->
    <text x="64" y="538" class="step">PRESENTATION · 같은 상태, 세 가지 인터페이스</text>
    <path class="branch" d="M1242 356V505H390"/>
    <circle cx="390" cy="505" r="4" fill="#2d6cab"/>
    <circle cx="696" cy="505" r="4" fill="#2d6cab"/>
    <circle cx="1002" cy="505" r="4" fill="#2d6cab"/>
    <path class="flow" d="M390 505V548"/>
    <path class="flow" d="M696 505V548"/>
    <path class="flow" d="M1002 505V548"/>

    <rect x="246" y="558" width="288" height="130" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="246" y="558" width="6" height="130" rx="3" fill="#2d6cab"/>
    <text x="278" y="598" class="label">CLI Report</text>
    <text x="278" y="627" class="body">승객별 결과 · 등급별 ATT</text>
    <text x="278" y="659" class="code">data_io/reporter.py</text>

    <rect x="552" y="558" width="288" height="130" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="552" y="558" width="6" height="130" rx="3" fill="#2d6cab"/>
    <text x="584" y="598" class="label">이벤트 로그</text>
    <text x="584" y="627" class="body">도착 · 배정 · 완료 tick 기록</text>
    <text x="584" y="659" class="code">main.py --log</text>

    <rect x="858" y="558" width="288" height="130" rx="18" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="858" y="558" width="6" height="130" rx="3" fill="#2d6cab"/>
    <text x="890" y="598" class="label">HTML GUI</text>
    <text x="890" y="627" class="body">타임라인 · 간트 차트 · 정책 비교</text>
    <text x="890" y="659" class="code">gui/web.py</text>

    <!-- The web GUI replays a pre-computed trace; no control flows back into the engine -->
    <text x="246" y="742" class="muted">웹 GUI는 미리 계산된 실행 기록을 재생하므로 엔진으로 되돌아가는 제어 흐름이 없습니다.</text>
  </g>
</svg>
